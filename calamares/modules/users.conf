---
defaultGroups:
    - users
    - lp
    - video
    - audio
    - network
    - storage
    - name: wheel
      must_exist: false
      system: true
autoLoginGroup: autologin
doAutologin: false
sudoersGroup: wheel
sudoersConfigureWithGroup: true
setRootPassword: false
doReusePassword: false
passwordRequirements:
    minLength: 4
    maxLength: -1
allowWeakPasswords: true
allowWeakPasswordsDefault: true
user:
    shell: /usr/bin/bash
hostname:
    location: EtcFile
    template: "@BRISA_ID@-${cpu}"
