---
modules-search: [ local, /usr/lib/calamares/modules ]

instances:
- id:       limpeza
  module:   shellprocess
  config:   shellprocess-limpeza.conf
- id:       chroot
  module:   shellprocess
  config:   shellprocess-chroot.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - shellprocess@limpeza
  - removeuser
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - shellprocess@chroot
  - initcpiocfg
  - initcpio
  - bootloader
  - umount
- show:
  - finished

branding: @BRISA_ID@
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
quit-at-end: false
