# Modo macOS: a tecla Super (Windows) faz o papel do ⌘ Command.
# Tocar Super sozinho continua abrindo o menu de apps.
[ids]
*

[meta]
# Editar
c = C-insert
v = S-insert
x = S-delete
z = C-z
a = C-a
s = C-s
f = C-f
# Abas, janelas e arquivos
t = C-t
w = C-w
n = C-n
o = C-o
p = C-p
r = C-r
l = C-l
q = A-f4
# Sistema
space = A-space
tab = A-tab
# Navegação em texto
left = home
right = end
up = C-home
down = C-end

[meta+shift]
z = C-S-z
t = C-S-t
3 = S-print
4 = M-S-print
