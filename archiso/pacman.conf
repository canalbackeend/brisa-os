# pacman.conf usado só para MONTAR a ISO (o sistema instalado usa o padrão do pacote pacman).
[options]
HoldPkg     = pacman glibc
Architecture = auto
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[brisa]
SigLevel = Optional TrustAll
Server = file:///repo
